name: GaonBazaar CI / Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: FastAPI Backend Tests & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Run pytest test suite (23 integration & security tests)
        run: |
          cd backend
          pytest tests -v --tb=short

  admin-build:
    name: Admin Web Portal Build & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/admin
          npm ci

      - name: Compile TypeScript and build with Vite
        run: |
          cd apps/admin
          npm run build

  flutter-checks:
    name: Flutter Apps & Shared Packages Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - packages/design_system
          - packages/localization
          - packages/shared_models
          - packages/api_client
          - apps/customer
          - apps/vendor
          - apps/runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd ${{ matrix.target }}
          flutter pub get

      - name: Analyze code
        run: |
          cd ${{ matrix.target }}
          flutter analyze --no-fatal-infos --no-fatal-warnings
