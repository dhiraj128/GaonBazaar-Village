name: Multi-User Security & Isolation Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-and-isolation-tests:
    name: Multi-User Security, IDOR & Concurrency Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Run Multi-User Isolation & Security Tests
        run: |
          cd backend
          pytest tests/test_multi_user_isolation_and_security.py -v --tb=short --junitxml=../security_isolation_report.xml

      - name: Run Concurrent Load & Race Condition Tests
        run: |
          cd backend
          pytest tests/test_concurrent_orders_load.py -v -s --tb=short --junitxml=../concurrency_load_report.xml

      - name: Run Full Backend Test Suite
        run: |
          cd backend
          pytest tests -v --tb=short --junitxml=../full_backend_test_report.xml

      - name: Upload Security Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression-reports
          path: |
            security_isolation_report.xml
            concurrency_load_report.xml
            full_backend_test_report.xml
