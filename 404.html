<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GaonBazaar</title>
  <script>
    // SPA redirect for GitHub Pages
    var path = window.location.pathname;
    if (path.indexOf('/customer/') !== -1) {
      window.location.replace('/GaonBazaar-Village/customer/');
    } else if (path.indexOf('/vendor/') !== -1) {
      window.location.replace('/GaonBazaar-Village/vendor/');
    } else if (path.indexOf('/runner/') !== -1) {
      window.location.replace('/GaonBazaar-Village/runner/');
    } else if (path.indexOf('/admin/') !== -1) {
      window.location.replace('/GaonBazaar-Village/admin/');
    } else {
      window.location.replace('/GaonBazaar-Village/');
    }
  </script>
</head>
<body>
</body>
</html>
